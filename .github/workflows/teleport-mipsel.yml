name: Build Teleport agent (mipsel)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Teleport version, or "latest" for the newest stable release
        required: true
        default: latest
  push:
    paths:
      - scripts/build-teleport-mipsel.sh
      - .github/workflows/teleport-mipsel.yml

permissions:
  contents: write

concurrency:
  group: teleport-mipsel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install mipsel musl soft-float toolchain
        run: |
          id=$(docker create muslcc/x86_64:mipsel-linux-muslsf /bin/true)
          sudo mkdir -p /opt/muslsf
          docker export "$id" | sudo tar -x -C /opt/muslsf
          docker rm "$id"
          /opt/muslsf/bin/gcc --version | head -1

      - name: Resolve version
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.version || 'latest' }}
        run: |
          v=$WANT
          [ "$v" = latest ] && v=$(gh release view -R gravitational/teleport --json tagName -q .tagName)
          echo "TELEPORT_VERSION=${v#v}" >> "$GITHUB_ENV"
          echo "Teleport ${v#v}"

      - name: Build
        env:
          CC: /opt/muslsf/bin/gcc
          CXX: /opt/muslsf/bin/g++
          READELF: /opt/muslsf/bin/readelf
          STRIP: /opt/muslsf/bin/strip
          WORK: ${{ runner.temp }}/teleport-build
        run: |
          mkdir -p "$WORK"
          sh scripts/build-teleport-mipsel.sh "$TELEPORT_VERSION" out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="teleport-v$TELEPORT_VERSION-mipsel"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" out/* --target "$GITHUB_SHA" \
            --title "Teleport $TELEPORT_VERSION agent for ClusterBox (linux/mipsel)" \
            --notes "Static linux/mipsle softfloat build of teleport $TELEPORT_VERSION for the MT7620A ClusterBox. Installed from LuCI: Services → Teleport."
