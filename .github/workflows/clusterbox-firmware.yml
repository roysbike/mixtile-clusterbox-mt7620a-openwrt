name: ClusterBox firmware

# Pull requests to main build and verify the firmware; v* tags build it
# from the tagged commit, verify it and publish the GitHub release that
# mixtile-update on the BMC reads.
on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clusterbox-firmware-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_UNSAFE_CONFIGURE: "1"

jobs:
  # Where to build. The self-hosted runner (label openwrt-n100, a
  # persistent build tree) only takes runs started by the repository
  # owner: pushes, tags, manual runs and pull requests from branches of
  # this repository. Everything else, pull requests from forks included,
  # builds on a GitHub-hosted runner. Fork pull requests also need an
  # approval before they run (repository setting).
  runner:
    runs-on: ubuntu-latest
    outputs:
      runs-on: ${{ steps.pick.outputs.runs-on }}
      self-hosted: ${{ steps.pick.outputs.self-hosted }}
    steps:
      - id: pick
        env:
          TRUSTED: ${{ github.actor == github.repository_owner && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          if [ "${TRUSTED}" = true ]; then
            echo 'runs-on=["self-hosted","openwrt-n100"]' >> "${GITHUB_OUTPUT}"
            echo 'self-hosted=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'runs-on="ubuntu-22.04"' >> "${GITHUB_OUTPUT}"
            echo 'self-hosted=false' >> "${GITHUB_OUTPUT}"
          fi
          cat "${GITHUB_OUTPUT}"

  firmware:
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.runs-on) }}
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      SELF_HOSTED: ${{ needs.runner.outputs.self-hosted }}

    steps:
      - name: Maximize build space
        if: env.SELF_HOSTED != 'true'
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          swap-size-mb: 1024
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Own the persistent build tree (self-hosted)
        # The build runs as root (sudo); hand the tree back to the runner
        # user so checkout and config steps can update it.
        if: env.SELF_HOSTED == 'true'
        run: sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Self-hosted: keep the build tree (toolchain, host tools,
          # downloads, built packages) from earlier runs.
          clean: ${{ env.SELF_HOSTED != 'true' }}

      - name: Persistent cache (self-hosted)
        if: env.SELF_HOSTED == 'true'
        run: |
          sudo mkdir -p /cache/ccache
          sudo chown -R "$(id -u):$(id -g)" /cache
          # Outputs of earlier runs never reach this run's artifacts.
          sudo rm -rf release extras files
          df -h . /cache

      - name: Firmware identity
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME}
          else
            version=$(git describe --tags --match 'v[0-9]*' --always)
          fi
          {
            echo "MIXTILE_FW_VERSION=${version}"
            echo "MIXTILE_GIT_COMMIT=$(git rev-parse HEAD)"
            echo "MIXTILE_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "MIXTILE_REPOSITORY=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          } | tee -a "${GITHUB_ENV}"

      - name: Tag, CHANGELOG and release notes agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          grep -q "^## \[${GITHUB_REF_NAME#v}\] - " CHANGELOG.md
          test -s "release-notes/${GITHUB_REF_NAME}.md"

      - name: Free extra disk space
        if: env.SELF_HOSTED != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghcActions
          sudo apt-get clean
          df -h /

      - name: Restore download cache
        if: env.SELF_HOSTED != 'true'
        uses: actions/cache@v6
        with:
          path: dl
          key: ${{ runner.os }}-clusterbox-v120-dl-${{ hashFiles('build.sh', 'feeds.conf.default', 'config/BoardConfig/cluster-box-config', 'package/openmiop/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-clusterbox-v120-dl-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang flex g++ gawk gcc-multilib gettext git \
            libncurses5-dev libncursesw5-dev libssl-dev python3 python3-distutils \
            python3-setuptools rsync unzip zlib1g-dev file wget swig ccache \
            subversion xsltproc zstd time squashfs-tools binutils

      - name: Prepare feeds
        run: |
          ./build.sh feeds_update
          ./build.sh feeds_install

      - name: Select board config
        run: ./build.sh cluster-box-config

      - name: Normalize config
        run: |
          if [ "${SELF_HOSTED}" = true ]; then
            echo 'CONFIG_CCACHE=y' >> .config
            echo 'CONFIG_CCACHE_DIR="/cache/ccache"' >> .config
          fi
          make defconfig
          for p in openmiop mixtile-release mixtile-update luci-app-mixtile-update nodectl luci-app-nodectl kmod-tun; do
            grep -qx "CONFIG_PACKAGE_${p}=y" .config || { echo "CONFIG_PACKAGE_${p} is not enabled"; exit 1; }
          done

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Clean target build for a release (self-hosted)
        # Toolchain and host tools stay; everything that goes into the
        # image is built again from the tagged sources.
        if: env.SELF_HOSTED == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: sudo make clean

      - name: Build firmware
        env:
          MAKE_VERBOSE: ""
        run: |
          touch first_run
          export MAKE_JOBS=$(nproc)
          sudo --preserve-env=MIXTILE_FW_VERSION,MIXTILE_GIT_COMMIT,MIXTILE_BUILD_DATE,MIXTILE_REPOSITORY,MAKE_JOBS,MAKE_VERBOSE \
            ./build.sh firmware

      - name: Collect release artifacts
        run: sudo env PATH="$PWD/staging_dir/host/bin:$PATH" GITHUB_SERVER_URL="$GITHUB_SERVER_URL" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_RUN_ID="$GITHUB_RUN_ID" ./scripts/clusterbox/collect-release.sh release extras

      - name: Upload firmware artifacts
        # also when verification fails, for inspection; never published then
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clusterbox-firmware-${{ env.MIXTILE_FW_VERSION }}
          if-no-files-found: error
          path: |
            release/
            extras/

      - name: Verify the firmware image
        run: |
          sudo chown -R "$(id -u)" release extras
          PATH="$PWD/staging_dir/host/bin:$PATH" ./scripts/clusterbox/verify-firmware.sh release \
            "${MIXTILE_FW_VERSION}" "${MIXTILE_GIT_COMMIT}"

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=
          case "${GITHUB_REF_NAME}" in *-*) pre=--prerelease ;; esac
          gh release create "${GITHUB_REF_NAME}" --verify-tag ${pre} \
            --title "ClusterBox BMC firmware ${GITHUB_REF_NAME}" \
            --notes-file "release-notes/${GITHUB_REF_NAME}.md" \
            release/*
